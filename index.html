<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Allocation Plan - Full Integrated Version</title>
    
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load React & ReactDOM (Production Version) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. Load Babel (Standalone) -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Sarabun', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS ---
        const IconBase = ({ children, className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Icons = {
            ChevronRight: (p) => <IconBase {...p}><path d="m9 18 6-6-6-6"/></IconBase>,
            ChevronDown: (p) => <IconBase {...p}><path d="m6 9 6 6 6-6"/></IconBase>,
            Search: (p) => <IconBase {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></IconBase>,
            Filter: (p) => <IconBase {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></IconBase>,
            Factory: (p) => <IconBase {...p}><path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/></IconBase>,
            Store: (p) => <IconBase {...p}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></IconBase>,
            Truck: (p) => <IconBase {...p}><path d="M10 17h4"/><path d="M5 17h.01"/><path d="M19 17h.01"/><path d="M14 17h1"/><path d="m10 17 2 3h2.5"/><path d="M22 12v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h1.5L8 3h8l2.5 2H20a2 2 0 0 1 2 2Z"/></IconBase>,
            Calendar: (p) => <IconBase {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></IconBase>,
            Clock: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>,
            Info: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconBase>,
            AlertTriangle: (p) => <IconBase {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></IconBase>,
            Check: (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>,
            LayoutGrid: (p) => <IconBase {...p}><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></IconBase>,
            List: (p) => <IconBase {...p}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></IconBase>,
            X: (p) => <IconBase {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>,
            PlusCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></IconBase>,
            ShoppingCart: (p) => <IconBase {...p}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            RotateCcw: (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>,
            CheckCircle2: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconBase>,
            Cpu: (p) => <IconBase {...p}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></IconBase>,
            MousePointer2: (p) => <IconBase {...p}><path d="m4.034 16.08-2.387-2.387 14.151-8.307 4.153 16.613-5.539-5.538-4.992 4.992-1.386-1.386 4.992-4.992-4.992-4.992Z"/></IconBase>,
            BarChart: (p) => <IconBase {...p}><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></IconBase>,
            Robot: (p) => <IconBase {...p}><rect width="18" height="12" x="3" y="6" rx="2"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/><path d="M10 14h4"/><line x1="12" x2="12" y1="2" y2="6"/><line x1="12" x2="12" y1="18" y2="22"/><line x1="2" x2="3" y1="10" y2="10"/><line x1="21" x2="22" y1="10" y2="10"/></IconBase>,
            ArrowRightLeft: (p) => <IconBase {...p}><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></IconBase>,
            FileClock: (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><circle cx="12" cy="16" r="3"/><path d="M12 16v-1.5"/></IconBase>,
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('individual');
            const [expandedItems, setExpandedItems] = useState({ 5: true });
            const [filterProduct, setFilterProduct] = useState('');
            const [filterFactory, setFilterFactory] = useState('All');
            const [filterVendor, setFilterVendor] = useState('All');

            const systemDateStr = "2026-01-21";
            const stockDateDisplay = "21 Jan 2026";

            // --- Individual States ---
            const [allocations, setAllocations] = useState({});
            const [activeSource, setActiveSource] = useState({}); 
            const [activePlanningQty, setActivePlanningQty] = useState({});
            const [showSourceModal, setShowSourceModal] = useState(null);
            const [selectedScenarios, setSelectedScenarios] = useState({});

            // --- Group States (Advanced) ---
            const [globalSelectedIds, setGlobalSelectedIds] = useState(['P1', 'P2', 'P3']);
            const [branchSelections, setBranchSelections] = useState({
                'bn': ['P1', 'P2', 'P3'],
                'kb': ['P1', 'P2', 'P3'],
                'tr': ['P1', 'P2', 'P3']
            });

            // --- Full Inventory Data ---
            const [inventory, setInventory] = useState([
                {
                    id: 5,
                    name: "BETAFIN LQD 38%",
                    group: "Betaine",
                    commonName: "Betaine Liquid",
                    supplier: "Danisco",
                    totalSoh: 40.0,
                    uom: "MT",
                    safetyStock: 45,
                    trialConfig: null,
                    pendingOrders: [
                        { id: "ord-3a", type: "INVOICE", docNo: "INV-BT-2024", qty: 24.0, eta: "2026-02-05", status: "Confirmed", isScheduled: true, allocations: { 'bn': 12.0, 'tr': 12.0 } },
                        { id: "ord-3b", type: "PO", docNo: "PO-BT-005", qty: 15.0, estEta: "2026-03-01", status: "Production", isScheduled: false },
                        { id: "ord-3c", type: "SHIPMENT", docNo: "SH-BT-009", qty: 10.0, estEta: "2026-03-10", status: "In Transit", isScheduled: false }
                    ],
                    factoryRatios: { 'bn': 0.4, 'tr': 0.3, 'hy': 0.15, 'kb': 0.1, 'kk': 0.05 },
                    factories: [
                        { id: 'bn', name: "Bangna", soh: 10 },
                        { id: 'tr', name: "Tarua", soh: 15 },
                        { id: 'hy', name: "Hadyai", soh: 5 },
                        { id: 'kb', name: "Kabinburi", soh: 5 },
                        { id: 'kk', name: "Khon Kaen", soh: 5 },
                    ],
                    scenarios: [
                        { id: 'sc1', name: 'Weekly Usage', desc: 'Based on current week actuals', rate: 3500, unit: 'KG/Day', type: 'Critical' },
                        { id: 'sc2', name: 'AVG Weekly Usage', desc: 'Based on 52-week average', rate: 2500, unit: 'KG/Day', type: 'Healthy', isDefault: true },
                        { id: 'sc4', name: 'AI Projection', desc: 'AI Forecast from System', rate: 2850, unit: 'KG/Day', type: 'Warning', isAI: true },
                    ]
                },
                {
                    id: 1,
                    name: "Axtra Prime 501 T",
                    group: "Enzymes",
                    commonName: "Multi NSP Powder",
                    supplier: "Danisco",
                    totalSoh: 45.0,
                    uom: "MT",
                    safetyStock: 30,
                    trialConfig: { isTrial: true, startDate: "2025-10-01", endDate: "2026-03-30", reason: "New formulation test run" },
                    pendingOrders: [
                        { id: "ord-1", type: "INVOICE", docNo: "INV-2024-001", qty: 15.0, eta: "2026-02-10", status: "On Vessel", isScheduled: true, allocations: { 'bn': 5.0, 'tr': 5.0, 'kb': 5.0 } },
                    ],
                    factoryRatios: { 'bn': 0.25, 'tr': 0.25, 'hy': 0.2, 'kb': 0.2, 'kk': 0.1 },
                    factories: [
                        { id: 'bn', name: "Bangna", soh: 10 },
                        { id: 'tr', name: "Tarua", soh: 10 },
                        { id: 'hy', name: "Hadyai", soh: 10 },
                        { id: 'kb', name: "Kabinburi", soh: 10 },
                        { id: 'kk', name: "Khon Kaen", soh: 5 },
                    ],
                    scenarios: [
                        { id: 'sc2', name: 'AVG Weekly Usage', desc: 'Standard average', rate: 850, unit: 'KG/Day', type: 'Healthy', isDefault: true },
                    ]
                }
            ]);

            useEffect(() => {
                const defaults = {};
                inventory.forEach(item => {
                    defaults[item.id] = item.scenarios.find(s => s.isDefault) || item.scenarios[0];
                });
                setSelectedScenarios(defaults);
            }, [inventory]);

            // --- HELPER FUNCTIONS ---
            const formatNumber = (num) => (num || 0).toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 });
            const formatInt = (num) => Math.floor(num || 0).toLocaleString();

            const getCurrentUsage = (item) => selectedScenarios[item.id] || item.scenarios.find(s => s.isDefault) || item.scenarios[0];

            const getRunOutDate = (days) => {
                if (!isFinite(days) || days <= 0) return "N/A";
                const date = new Date(systemDateStr);
                date.setDate(date.getDate() + Math.floor(days));
                return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' });
            };

            const calculateNeedByDate = (factory, item) => {
                const usage = getCurrentUsage(item);
                const ratio = item.factoryRatios[factory.id] || 0;
                const dailyMT = (usage.rate * ratio) / 1000;
                const doh = dailyMT > 0 ? (factory.soh / dailyMT) : 999;
                const date = new Date(systemDateStr);
                date.setDate(date.getDate() + Math.floor(doh));
                return date.toISOString().split('T')[0];
            };

            const getTrialStatus = (item) => {
                if (!item.trialConfig?.isTrial) return null;
                const current = new Date(systemDateStr);
                const end = new Date(item.trialConfig.endDate);
                const isExpired = current > end;
                return { isExpired, endDateFormatted: end.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }), reason: item.trialConfig.reason };
            };

            // --- EVENT HANDLERS ---
            const handleSelectSource = (itemId, orderId) => {
                setActiveSource(prev => ({ ...prev, [itemId]: orderId }));
                const item = inventory.find(i => i.id === itemId);
                const order = item.pendingOrders.find(o => o.id === orderId);
                setActivePlanningQty(prev => ({ ...prev, [itemId]: order.qty }));
                setShowSourceModal(null);
            };

            const handleAIAllocate = (item, orderId) => {
                const qty = parseFloat(activePlanningQty[item.id]);
                if (!qty) return;
                const itemAllocations = { ...allocations[item.id] };
                item.factories.forEach(f => {
                    const ratio = item.factoryRatios[f.id] || 0;
                    if (!itemAllocations[f.id]) itemAllocations[f.id] = {};
                    itemAllocations[f.id][orderId] = (qty * ratio).toFixed(3);
                });
                setAllocations(prev => ({ ...prev, [item.id]: itemAllocations }));
            };

            const uniqueVendors = ['All', ...new Set(inventory.map(i => i.supplier))];

            return (
                <div className="flex flex-col h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden text-[12px]">
                    {/* --- HEADER --- */}
                    <header className="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0 shadow-sm z-30">
                        <div className="flex items-center gap-4">
                            <div>
                                <h1 className="text-lg font-extrabold text-slate-800 tracking-tight leading-none">Stock Allocation Plan</h1>
                                <p className="text-[10px] text-slate-500 font-medium italic mt-1 uppercase tracking-widest">Multi-Branch Optimizer</p>
                            </div>
                            <div className="h-8 w-px bg-gray-200 mx-2"></div>
                            <div className="bg-slate-100 p-1 rounded-lg flex items-center gap-1 border">
                                <button onClick={() => setActiveTab('individual')} className={`px-4 py-1.5 rounded-md text-[11px] font-bold flex items-center gap-2 transition-all ${activeTab === 'individual' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <Icons.List className="w-3.5 h-3.5" /> Individual SKU
                                </button>
                                <button onClick={() => setActiveTab('group')} className={`px-4 py-1.5 rounded-md text-[11px] font-bold flex items-center gap-2 transition-all ${activeTab === 'group' ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'}`}>
                                    <Icons.LayoutGrid className="w-3.5 h-3.5" /> Substitute Groups
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <div className="flex flex-col items-end">
                                <span className="text-[10px] uppercase text-slate-400 font-bold tracking-wider leading-none">Stock As Of</span>
                                <span className="text-sm font-bold text-slate-700 flex items-center gap-1.5 mt-1"><Icons.Calendar className="w-3.5 h-3.5 text-blue-500" /> {stockDateDisplay}</span>
                            </div>
                            <button className="px-5 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-md hover:bg-blue-700 transition-all">Confirm Plans</button>
                        </div>
                    </header>

                    {/* --- FILTERS (Individual) / Group Selection (Group) --- */}
                    {activeTab === 'individual' ? (
                        <div className="bg-white border-b border-gray-200 px-6 py-4 grid grid-cols-4 gap-4 items-end shadow-sm z-20">
                            <div className="space-y-1"><label className="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1"><Icons.Search className="w-3 h-3"/> Search Product</label><input type="text" placeholder="Name or Common..." className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none" value={filterProduct} onChange={(e) => setFilterProduct(e.target.value)} /></div>
                            <div className="space-y-1"><label className="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1"><Icons.Factory className="w-3 h-3"/> Branch</label><select className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none" value={filterFactory} onChange={(e) => setFilterFactory(e.target.value)}><option value="All">All Branches</option>{['Bangna', 'Tarua', 'Kabinburi'].map(b => <option key={b} value={b}>{b}</option>)}</select></div>
                            <div className="space-y-1"><label className="text-[10px] font-bold text-slate-400 uppercase flex items-center gap-1"><Icons.Store className="w-3 h-3"/> Supplier</label><select className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none" value={filterVendor} onChange={(e) => setFilterVendor(e.target.value)}>{uniqueVendors.map(v => <option key={v} value={v}>{v}</option>)}</select></div>
                            <div className="flex justify-end"><button onClick={() => {setFilterProduct(''); setFilterFactory('All'); setFilterVendor('All');}} className="px-6 py-2 bg-slate-100 text-slate-500 rounded-lg text-xs font-bold hover:bg-slate-200 transition-all flex items-center gap-2"><Icons.RotateCcw size={14} /> Reset Filters</button></div>
                        </div>
                    ) : (
                        <div className="h-0 invisible"></div>
                    )}

                    {/* --- MAIN CONTENT --- */}
                    <div className="flex-1 overflow-hidden bg-slate-50 flex">
                        {activeTab === 'individual' ? (
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-4">
                                {/* Table Headers */}
                                <div className="grid grid-cols-12 gap-4 px-4 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider bg-white rounded-t-xl border-b">
                                    <div className="col-span-4 pl-8">Item Name</div>
                                    <div className="col-span-1 text-right">Warehouse SOH</div>
                                    <div className="col-span-1 text-center">Avg Usage</div>
                                    <div className="col-span-1 text-center text-orange-500">SOH End Date</div>
                                    <div className="col-span-1 text-right text-blue-600">Scheduled Inbound</div>
                                    <div className="col-span-1 text-right text-purple-600">Open PO Bal.</div>
                                    <div className="col-span-1 text-center">Status</div>
                                    <div className="col-span-2 text-center text-slate-900 font-extrabold">Max Reach</div>
                                </div>

                                {inventory.filter(i => (filterProduct===''||i.name.toLowerCase().includes(filterProduct.toLowerCase())) && (filterVendor==='All'||i.supplier===filterVendor)).map(item => {
                                    const expanded = expandedItems[item.id];
                                    const currentUsage = getCurrentUsage(item);
                                    const dailyMT = currentUsage.rate / 1000;
                                    const totalStock = item.totalSoh + item.pendingOrders.reduce((sum, o) => sum + o.qty, 0);
                                    const reach = dailyMT > 0 ? (totalStock / dailyMT) : 999;
                                    const trial = getTrialStatus(item);

                                    return (
                                        <div key={item.id} className={`bg-white rounded-xl shadow-sm border transition-all ${expanded ? 'border-blue-300 ring-1 ring-blue-50' : 'border-gray-200 hover:border-blue-200'}`}>
                                            {/* Row Header */}
                                            <div className="grid grid-cols-12 gap-4 px-4 py-4 items-center cursor-pointer" onClick={() => setExpandedItems({...expandedItems, [item.id]: !expanded})}>
                                                <div className="col-span-4 flex items-center gap-3">
                                                    <div className={`p-1 rounded transition-transform ${expanded ? 'rotate-90 text-blue-600' : 'text-slate-300'}`}><Icons.ChevronRight size={16}/></div>
                                                    <div>
                                                        <div className="font-bold text-slate-800 text-sm flex items-center gap-2">{item.name} {trial && <span className="bg-blue-100 text-blue-600 px-1 py-0.5 rounded text-[8px] font-black tracking-tighter uppercase">TRIAL</span>}</div>
                                                        <div className="text-[11px] text-slate-400 font-medium">{item.commonName} • {item.supplier}</div>
                                                    </div>
                                                </div>
                                                <div className="col-span-1 text-right font-bold text-slate-700 text-sm font-mono">{formatNumber(item.totalSoh)}</div>
                                                <div className="col-span-1 text-center">
                                                    <div className="font-bold text-slate-700 font-mono">{formatInt(currentUsage.rate)}</div>
                                                    <div className="text-[9px] text-slate-400 uppercase">{currentUsage.name}</div>
                                                </div>
                                                <div className="col-span-1 text-center text-sm font-bold text-orange-500">{getRunOutDate(item.totalSoh / dailyMT)}</div>
                                                <div className="col-span-1 text-right font-bold text-blue-600">{formatNumber(item.pendingOrders.filter(o => o.isScheduled).reduce((s,o)=>s+o.qty,0))}</div>
                                                <div className="col-span-1 text-right font-bold text-purple-600">{formatNumber(item.pendingOrders.filter(o => !o.isScheduled).reduce((s,o)=>s+o.qty,0))}</div>
                                                <div className="col-span-1 text-center text-[10px] text-slate-400">{activeSource[item.id] ? <span className="text-purple-600 font-bold">Allocating...</span> : 'Ready'}</div>
                                                <div className="col-span-2 text-center">
                                                    <div className="font-bold text-slate-900 text-sm">{getRunOutDate(reach)}</div>
                                                    <div className="text-[9px] text-slate-400 italic">{reach.toFixed(1)} Days</div>
                                                </div>
                                            </div>

                                            {/* Expand Content */}
                                            {expanded && (
                                                <div className="border-t border-slate-100 bg-slate-50/50 p-6 animate-fade-in-up">
                                                    {/* Trial Banner */}
                                                    {trial && (
                                                        <div className={`mb-6 p-4 rounded-xl border flex gap-4 ${trial.isExpired ? 'bg-red-50 border-red-200' : 'bg-blue-50 border-blue-200'}`}>
                                                            <div className={`p-2 rounded-full ${trial.isExpired ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}><Icons.Info size={20}/></div>
                                                            <div>
                                                                <h4 className="font-bold text-sm">{trial.isExpired ? 'TRIAL ENDED' : 'ACTIVE TRIAL PRODUCT'}</h4>
                                                                <p className="text-xs opacity-70">Evaluated until {trial.endDateFormatted} ({trial.reason})</p>
                                                            </div>
                                                        </div>
                                                    )}

                                                    {/* Matrix View */}
                                                    <div className="bg-white border rounded-xl overflow-hidden shadow-md">
                                                        <div className="bg-slate-900 text-white px-4 py-3 flex justify-between items-center">
                                                            <h4 className="text-xs font-bold uppercase tracking-wider">Branch-Wise Simulation</h4>
                                                            <div className="flex gap-2">
                                                                {!activeSource[item.id] ? (
                                                                    <button onClick={() => setShowSourceModal(item)} className="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold text-[10px] shadow-lg animate-pulse">
                                                                        SELECT OPEN SOURCE
                                                                    </button>
                                                                ) : (
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-[10px] text-purple-300 italic font-medium mr-2">Source: {item.pendingOrders.find(o=>o.id===activeSource[item.id])?.docNo}</span>
                                                                        <button onClick={() => handleAIAllocate(item, activeSource[item.id])} className="px-4 py-1.5 bg-purple-600 text-white rounded-lg font-bold text-[10px] flex items-center gap-2 hover:bg-purple-700 transition-colors">
                                                                            <Icons.Robot size={14}/> AI Allocate
                                                                        </button>
                                                                        <button onClick={() => setActiveSource(prev => ({...prev, [item.id]: null}))} className="px-2 py-1.5 bg-slate-700 text-white rounded-lg hover:bg-slate-600 transition-colors">
                                                                            <Icons.X size={14}/>
                                                                        </button>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div className="p-4 bg-white">
                                                            <table className="w-full text-left border-collapse">
                                                                <thead>
                                                                    <tr className="border-b border-slate-100 text-[10px] text-slate-400 uppercase">
                                                                        <th className="pb-2 font-bold">Factory</th>
                                                                        <th className="pb-2 font-bold text-right">Current SOH</th>
                                                                        <th className="pb-2 font-bold text-center">Need By</th>
                                                                        <th className="pb-2 font-bold text-right">Allocation (MT)</th>
                                                                    </tr>
                                                                </thead>
                                                                <tbody>
                                                                    {item.factories.map(f => {
                                                                        const needByDate = calculateNeedByDate(f, item);
                                                                        const allocValue = allocations[item.id]?.[f.id]?.[activeSource[item.id]] || '';
                                                                        return (
                                                                            <tr key={f.id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50">
                                                                                <td className="py-3 font-bold text-slate-700">{f.name}</td>
                                                                                <td className="py-3 text-right font-mono text-slate-600">{formatNumber(f.soh)}</td>
                                                                                <td className="py-3 text-center text-orange-500 font-bold">{needByDate}</td>
                                                                                <td className="py-3 text-right">
                                                                                    <input 
                                                                                        type="number" 
                                                                                        className={`w-24 text-right border rounded px-2 py-1 text-sm outline-none focus:border-blue-500 ${activeSource[item.id] ? 'border-slate-300' : 'border-slate-100 bg-slate-50 text-slate-300'}`}
                                                                                        placeholder="0.000"
                                                                                        value={allocValue}
                                                                                        onChange={(e) => {
                                                                                            const val = e.target.value;
                                                                                            setAllocations(prev => ({
                                                                                                ...prev,
                                                                                                [item.id]: {
                                                                                                    ...prev[item.id],
                                                                                                    [f.id]: {
                                                                                                        ...(prev[item.id]?.[f.id] || {}),
                                                                                                        [activeSource[item.id]]: val
                                                                                                    }
                                                                                                }
                                                                                            }));
                                                                                        }}
                                                                                        disabled={!activeSource[item.id]}
                                                                                    />
                                                                                </td>
                                                                            </tr>
                                                                        );
                                                                    })}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-6">
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 flex flex-col items-center justify-center text-slate-400 min-h-[400px]">
                                    <Icons.LayoutGrid size={64} className="mb-4 text-slate-200" />
                                    <h3 className="text-xl font-bold text-slate-600 mb-2">Substitute Groups Dashboard</h3>
                                    <p className="text-sm text-center max-w-md">The multi-branch group analysis module has not been fully implemented in this preview. Please switch back to the Individual SKU tab to continue allocation planning.</p>
                                    <button onClick={() => setActiveTab('individual')} className="mt-6 px-6 py-2 bg-slate-800 text-white rounded-lg text-sm font-bold shadow-md hover:bg-slate-700 transition-all">Go to Individual SKU</button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* --- MODALS --- */}
                    {showSourceModal && (
                        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden animate-fade-in-up">
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                                        <Icons.Truck size={16} className="text-blue-500"/> Select Replenishment Source
                                    </h3>
                                    <button onClick={() => setShowSourceModal(null)} className="text-slate-400 hover:text-red-500 transition-colors p-1"><Icons.X size={20}/></button>
                                </div>
                                <div className="p-6">
                                    <div className="space-y-3">
                                        {showSourceModal.pendingOrders.map(order => (
                                            <div key={order.id} className="flex items-center justify-between p-4 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50/50 cursor-pointer transition-all shadow-sm hover:shadow" onClick={() => handleSelectSource(showSourceModal.id, order.id)}>
                                                <div>
                                                    <div className="font-bold text-slate-800 flex items-center gap-2">
                                                        {order.docNo}
                                                        {order.isScheduled && <span className="px-2 py-0.5 bg-green-100 text-green-700 rounded text-[9px] uppercase tracking-wider font-bold">Scheduled</span>}
                                                    </div>
                                                    <div className="text-[11px] text-slate-500 mt-1">{order.type} • ETA: <span className="font-bold text-slate-700">{order.eta || order.estEta}</span></div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-black text-blue-600 text-lg">{formatNumber(order.qty)} <span className="text-xs text-slate-400 font-normal">{showSourceModal.uom}</span></div>
                                                    <div className="text-[10px] text-slate-400 font-medium">{order.status}</div>
                                                </div>
                                            </div>
                                        ))}
                                        {showSourceModal.pendingOrders.length === 0 && (
                                            <div className="text-center py-8 text-slate-400 text-sm border-2 border-dashed border-slate-200 rounded-xl">
                                                No incoming sources available for this item.
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
